<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Sentinel Pro | Monitor de Ballenas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(51, 65, 85, 0.4); }
        .rsi-bar-fill { transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1), background-color 1s; }
        .price-up { color: #10b981; text-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .price-down { color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-4 lg:p-10">

    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-end mb-8 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-black tracking-tighter italic text-white">
                    BITCOIN <span class="text-blue-500">SENTINEL</span>
                </h1>
                <p class="text-[10px] text-slate-500 uppercase tracking-[0.4em] mt-1 font-bold">Monitor On-Chain & Análisis Técnico IA</p>
            </div>
            <div id="connection-badge" class="px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-black">
                SISTEMA ACTIVO
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2">
                <div class="glass rounded-[2.5rem] p-8 lg:p-10 shadow-2xl h-full relative overflow-hidden">
                    <div class="flex items-center gap-4 mb-8">
                        <div class="p-3 bg-blue-600/20 rounded-2xl text-blue-400 font-bold italic border border-blue-500/20">IA</div>
                        <div>
                            <h2 class="text-xs font-black text-blue-400 uppercase tracking-widest">Análisis de Ciclo 24h</h2>
                            <h1 class="text-2xl font-bold text-white tracking-tight">Reporte Técnico e Institucional</h1>
                        </div>
                    </div>
                    <div id="ia-box" class="text-slate-300 leading-relaxed text-lg whitespace-pre-line pr-4 overflow-y-auto max-h-[650px]">
                        <div class="animate-pulse space-y-4">
                            <div class="h-4 bg-slate-800 rounded w-full"></div>
                            <div class="h-4 bg-slate-800 rounded w-5/6"></div>
                            <p class="text-slate-600 text-sm italic mt-6 text-center uppercase tracking-widest">Consultando Groq Llama 3.3...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="glass rounded-[2rem] p-8 border-b-4 border-blue-500/20 shadow-xl">
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 text-center">Cotización en Tiempo Real</p>
                    <div id="price" class="text-5xl font-black tracking-tighter text-white mb-8 text-center transition-all duration-300">Cargando...</div>
                    
                    <div class="pt-6 border-t border-slate-800">
                        <div class="flex justify-between items-end mb-3">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest text-blue-400">Indicador RSI (14)</span>
                            <span id="rsi-val" class="text-xl font-black text-white">--</span>
                        </div>
                        <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-slate-800">
                            <div id="rsi-bar" class="rsi-bar-fill h-full w-0 bg-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.5)]"></div>
                        </div>
                    </div>
                </div>

                <div class="glass rounded-[2rem] p-6 h-[480px] flex flex-col border border-slate-800/50 shadow-xl">
                    <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-800">
                        <h3 class="text-[10px] font-black text-slate-300 uppercase tracking-widest flex items-center gap-2">
                            <span class="flex h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            Monitor de Ballenas (> $50,000)
                        </h3>
                    </div>
                    <div id="whale-feed" class="flex-1 overflow-y-auto space-y-3 pr-2 scroll-smooth">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE URLS
        const backendHost = 'cryptopro-tfg-sentinel.onrender.com';
        
        // Conexiones WebSocket
        const serverSocket = new WebSocket(`wss://${backendHost}/ws/crypto`);
        const binanceSocket = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@aggTrade');

        const priceEl = document.getElementById('price');
        const rsiVal = document.getElementById('rsi-val');
        const rsiBar = document.getElementById('rsi-bar');
        const iaBox = document.getElementById('ia-box');
        const feed = document.getElementById('whale-feed');

        // 1. MANEJAR DATOS DEL BACKEND (RSI e IA)
        serverSocket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === "rsi_update") {
                rsiVal.innerText = data.value;
                rsiBar.style.width = data.value + "%";
                // Lógica de color según RSI
                if (data.value >= 70) rsiBar.style.backgroundColor = "#fbbf24"; // Sobrecompra
                else if (data.value <= 30) rsiBar.style.backgroundColor = "#22d3ee"; // Sobreventa
                else rsiBar.style.backgroundColor = "#3b82f6"; // Neutral
            }
            
            if (data.type === "initial") {
                iaBox.innerHTML = `<div class="fade-in">${data.ia_content}</div>`;
            }
        };

        // 2. MANEJAR DATOS DE BINANCE (Precio y Ballenas con filtro corregido)
        binanceSocket.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            const p = parseFloat(msg.p); // Precio
            const q = parseFloat(msg.q); // Cantidad
            const v_usd = p * q;         // VALOR TOTAL EN DÓLARES
            const es_venta = msg.m;      // Market maker side

            // Actualizar Precio Principal
            priceEl.innerText = `$${p.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            priceEl.className = es_venta ? "text-5xl font-black mb-8 text-center price-down" : "text-5xl font-black mb-8 text-center price-up";

            // FILTRO DE ALERTA: Solo mayor o igual a $50,000 USD
            if (v_usd >= 50000) {
                const div = document.createElement('div');
                div.className = `fade-in p-3 rounded-xl border mb-2 ${es_venta ? 'bg-red-500/10 border-red-500/20 text-red-400' : 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400'}`;
                
                div.innerHTML = `
                    <div class="flex justify-between items-center text-[10px] font-bold">
                        <span class="tracking-widest">${es_venta ? 'BALLENA VENDIENDO 🔴' : 'BALLENA COMPRANDO 🟢'}</span>
                        <span class="font-mono text-xs">$${v_usd.toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
                    </div>`;
                
                feed.prepend(div);

                // Mantener solo las últimas 15 alertas
                if (feed.children.length > 15) {
                    feed.lastChild.remove();
                }
            }
        };

        // Reconexión en caso de error
        binanceSocket.onclose = () => {
            console.log("Reconectando a Binance...");
            setTimeout(() => location.reload(), 5000);
        };
    </script>
</body>
</html>
